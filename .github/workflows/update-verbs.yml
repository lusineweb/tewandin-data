# Every month: download all Kurmanji conjugation tables from Wîkîferheng, rebuild src/data/verbs.json
# and commit it. Installed apps pick up the new data from this repository (src/lib/remote.ts).
name: Daneyên lêkeran nû bike

on:
  schedule:
    - cron: '17 3 1 * *'   # 03:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-verbs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch from Wîkîferheng
        env:
          WIKI_USER_AGENT: TewandinBot/1.0 (https://github.com/${{ github.repository }}; monthly data refresh)
        run: node scripts/fetch-wiki.mjs "$RUNNER_TEMP/tewandin-wiki.json"
      - name: Rebuild data
        run: |
          node scripts/import-wiki.mjs "$RUNNER_TEMP/tewandin-wiki.json"
          mkdir -p src/data
          npm run data
      - name: Test
        run: node scripts/test-extract.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- src/data scripts/data-wikiferheng-full.txt)" ]; then
            echo "Daneyan guhertin tune."
            exit 0
          fi
          git config user.name "tewandin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data scripts/data-wikiferheng-full.txt
          git commit -m "Daneyên lêkeran: $(node -p "require('./src/data/manifest.json').count") lêker ($(date -u +%Y-%m-%d))"
          git push

